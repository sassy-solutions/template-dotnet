# ArgoCD Application definition (multi-source)
# This file tells ArgoCD how to deploy this service
# Uses multi-source: app repo values + Infrastructure Helm chart

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: __SERVICE_NAME__-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: __SERVICE_NAME__
    app.kubernetes.io/environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Source 1: This repo (provides deploy/values.yaml)
    - repoURL: https://github.com/sassy-solutions/__SERVICE_NAME__.git
      targetRevision: HEAD
      ref: values

    # Source 2: Infrastructure Helm chart
    - repoURL: https://github.com/sassy-solutions/Infrastructure.git
      targetRevision: HEAD
      path: helm/charts/dotnet-microservice
      helm:
        valueFiles:
          - $values/deploy/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: __SERVICE_NAME__-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
