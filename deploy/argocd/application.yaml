# ArgoCD Application definition
# This file tells ArgoCD how to deploy this service

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: __SERVICE_NAME__-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: __SERVICE_NAME__
    app.kubernetes.io/environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Use the generic Helm chart from Infrastructure repo
    repoURL: https://github.com/sassy-solutions/Infrastructure.git
    targetRevision: HEAD
    path: helm/charts/dotnet-microservice

    helm:
      # Merge values from this repo with the chart
      valueFiles:
        # Base values from the chart
        - values.yaml
      # Override with this service's values
      values: |
        # Import values from this repository
        # ArgoCD will fetch deploy/values.yaml from this repo

  destination:
    server: https://kubernetes.default.svc
    namespace: __SERVICE_NAME__-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health checks
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas

---
# Application for fetching values from this repo
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: __SERVICE_NAME__-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: __SERVICE_NAME__
    app.kubernetes.io/component: config
spec:
  project: default

  source:
    repoURL: https://github.com/sassy-solutions/__SERVICE_NAME__.git
    targetRevision: HEAD
    path: deploy
    directory:
      recurse: false
      include: 'values.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: __SERVICE_NAME__-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
