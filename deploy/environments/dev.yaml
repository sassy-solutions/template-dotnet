# Development environment overrides
app:
  environment: "dev"

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Dev can have faster rollouts
rollout:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 10s }

# Ingress disabled in dev by default
ingress:
  enabled: false

# Tailscale enabled for private access
tailscale:
  enabled: true

autoscaling:
  enabled: false

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Development"
  - name: Logging__LogLevel__Default
    value: "Debug"
