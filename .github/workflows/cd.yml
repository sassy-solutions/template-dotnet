name: "CD"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/bootstrap.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  check-bootstrap:
    name: Check Bootstrap
    runs-on: ubuntu-latest
    outputs:
      bootstrapped: ${{ steps.check.outputs.bootstrapped }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .bootstrapped
      - id: check
        run: |
          if [ -f .bootstrapped ]; then
            echo "bootstrapped=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Not yet bootstrapped — skipping CD"
            echo "bootstrapped=false" >> $GITHUB_OUTPUT
          fi

  preflight:
    name: Preflight Check
    needs: check-bootstrap
    if: needs.check-bootstrap.outputs.bootstrapped == 'true'
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
    steps:
      - name: Check deployment prerequisites
        id: check
        env:
          REGISTRY: ${{ vars.REGISTRY_ENDPOINT }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "can_deploy=false" >> $GITHUB_OUTPUT
            echo "::warning::CD skipped: REGISTRY_ENDPOINT not configured yet"
          else
            echo "can_deploy=true" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    name: Build & Push Image
    needs: preflight
    runs-on: ubuntu-latest
    if: |
      needs.preflight.outputs.can_deploy == 'true' &&
      github.repository != 'sassy-solutions/template-dotnet'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_full: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REGISTRY: ${{ vars.REGISTRY_ENDPOINT }}
        run: |
          # Get service name from repo (using env var to avoid injection)
          SERVICE_NAME="${GITHUB_REPOSITORY##*/}"
          SERVICE_NAME_KEBAB=$(echo "$SERVICE_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')

          # Determine version tag (using env var to avoid injection)
          if [ "$EVENT_NAME" = "release" ]; then
            # Sanitize tag: only allow alphanumeric, dots, hyphens
            VERSION=$(echo "$RELEASE_TAG" | tr -cd '[:alnum:].-')
          else
            VERSION="sha-${GITHUB_SHA::8}"
          fi

          IMAGE="${REGISTRY}/${SERVICE_NAME_KEBAB}-api"

          echo "service_name=$SERVICE_NAME_KEBAB" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "image_full=${IMAGE}:${VERSION}" >> $GITHUB_OUTPUT

          echo "::notice::Image: ${IMAGE}:${VERSION}"

      - name: Login to Scaleway Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            INFORMATIONAL_VERSION=${{ steps.meta.outputs.version }}+${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Output image
        run: |
          echo "image=${{ steps.meta.outputs.image_full }}" >> $GITHUB_OUTPUT

  update-deployment:
    name: Update Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update image tag in values
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          # Update the image tag in deploy/values.yaml
          sed -i "s|tag: \".*\"|tag: \"${IMAGE_TAG}\"|g" deploy/values.yaml

          # Bump the kustomize image tag for the Nexus GitOps deploy path
          # (.nexus/manifests, POM-108). A Nexus version tag pins this commit,
          # so the manifests at that tag reference the image built from it.
          if [ -f ".nexus/manifests/base/kustomization.yaml" ]; then
            sed -i "s|newTag: .*|newTag: \"${IMAGE_TAG}\"|" .nexus/manifests/base/kustomization.yaml
            echo "Updated .nexus/manifests/base/kustomization.yaml:"
            grep -B1 "newTag:" .nexus/manifests/base/kustomization.yaml || true
          fi

          # Show the change
          echo "Updated deploy/values.yaml:"
          grep -A2 "image:" deploy/values.yaml || true

      - name: Commit and push
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deploy/values.yaml
          if [ -f ".nexus/manifests/base/kustomization.yaml" ]; then
            git add .nexus/manifests/base/kustomization.yaml
          fi
          # [skip ci] prevents infinite loop when this commit triggers the workflow again
          git diff --staged --quiet || git commit -m "chore: update image to ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin main && git push

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Deployment Update

          ## Image Published
          \`${{ needs.build-and-push.outputs.image_full }}\`

          ## ArgoCD
          ArgoCD will automatically detect the change and deploy the new version.

          Monitor deployment:
          - ArgoCD UI: https://argocd.sassy.solutions
          - Application: ${{ github.repository }}

          EOF

  deploy-dev:
    name: Deploy to Dev
    needs: [build-and-push, update-deployment]
    runs-on: ubuntu-latest
    environment: dev
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger ArgoCD Sync
        run: |
          # ArgoCD will auto-sync, but we can force it for immediate deployment
          echo "::notice::ArgoCD will automatically sync the new deployment"
          echo "::notice::Image: ${{ needs.build-and-push.outputs.image_full }}"

  deploy-prod:
    name: Deploy to Production
    needs: [build-and-push, update-deployment]
    runs-on: ubuntu-latest
    environment: prod
    # Only deploy to prod on release
    if: github.event_name == 'release'

    steps:
      - name: Production deployment
        run: |
          echo "::notice::Production deployment triggered"
          echo "::notice::Version: ${{ github.event.release.tag_name }}"
          echo "::notice::Image: ${{ needs.build-and-push.outputs.image_full }}"
