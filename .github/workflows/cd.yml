name: "CD"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/bootstrap.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Branch name or commit SHA to build the image from. The image is
          pushed as {registry}/{subdomain}-api:sha-{first 8 chars of the
          RESOLVED commit SHA}. Leave blank to build the default branch HEAD.
          Used by the Nexus platform to build a specific commit on demand
          before deploying it (deploy-from-commit). On-demand builds only
          build + push the image; they do NOT commit to the deploy branch or
          trigger the dev/prod deploy jobs.
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: read

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  check-bootstrap:
    name: Check Bootstrap
    runs-on: ubuntu-latest
    outputs:
      bootstrapped: ${{ steps.check.outputs.bootstrapped }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .bootstrapped
      - id: check
        run: |
          if [ -f .bootstrapped ]; then
            echo "bootstrapped=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Not yet bootstrapped — skipping CD"
            echo "bootstrapped=false" >> $GITHUB_OUTPUT
          fi

  preflight:
    name: Preflight Check
    needs: check-bootstrap
    if: needs.check-bootstrap.outputs.bootstrapped == 'true'
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
    steps:
      - name: Check deployment prerequisites
        id: check
        env:
          REGISTRY: ${{ vars.REGISTRY_ENDPOINT }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "can_deploy=false" >> $GITHUB_OUTPUT
            echo "::warning::CD skipped: REGISTRY_ENDPOINT not configured yet"
          else
            echo "can_deploy=true" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    name: Build & Push Image
    needs: preflight
    runs-on: ubuntu-latest
    # Mirrors the workflow-level grants and adds id-token: write, which the
    # REGISTRY_KIND=scw-oidc login below needs to mint this run's OIDC identity.
    # Do NOT add `environment:` to this job: it reshapes the OIDC `sub` claim
    # and the Nexus exchange refuses the token.
    permissions:
      contents: write
      packages: read
      id-token: write
    if: |
      needs.preflight.outputs.can_deploy == 'true' &&
      github.repository != 'sassy-solutions/template-dotnet'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_full: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On workflow_dispatch, build the requested ref (branch or SHA). When
          # the input is blank (or any other trigger), an empty value tells
          # checkout to use the event's default ref:
          #   - push    -> the pushed commit (GITHUB_SHA)
          #   - release -> the release tag
          #   - dispatch (blank ref) -> the default branch HEAD
          ref: ${{ inputs.ref }}
          # Need full history so we can resolve an arbitrary ref to its commit
          # SHA (a short SHA input, or a branch name) via `git rev-parse`.
          fetch-depth: 0

      - name: Extract metadata
        id: meta
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REGISTRY: ${{ vars.REGISTRY_ENDPOINT }}
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          # Get service name from repo (using env var to avoid injection)
          SERVICE_NAME="${GITHUB_REPOSITORY##*/}"
          SERVICE_NAME_KEBAB=$(echo "$SERVICE_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')

          # Resolve the commit SHA that was actually checked out. HEAD points at
          # the ref checkout resolved (the pushed commit, the release tag, the
          # default branch HEAD, or the dispatched branch/SHA input). This is the
          # SHA Nexus's BuildImageReference uses to compute the image tag, so the
          # pushed tag MUST equal sha-{first8(resolved_sha)} for the ref built.
          RESOLVED_SHA=$(git rev-parse HEAD)
          SHORT_SHA="${RESOLVED_SHA:0:8}"

          # Determine version tag (using env var to avoid injection)
          if [ "$EVENT_NAME" = "release" ]; then
            # Sanitize tag: only allow alphanumeric, dots, hyphens
            VERSION=$(echo "$RELEASE_TAG" | tr -cd '[:alnum:].-')
          else
            # push and workflow_dispatch both tag by the resolved commit SHA.
            # On push, HEAD == GITHUB_SHA so this is identical to the previous
            # "sha-${GITHUB_SHA::8}" behavior. On dispatch, HEAD is the resolved
            # input ref (branch HEAD or the given SHA).
            VERSION="sha-${SHORT_SHA}"
          fi

          IMAGE="${REGISTRY}/${SERVICE_NAME_KEBAB}-api"

          echo "service_name=$SERVICE_NAME_KEBAB" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "image_full=${IMAGE}:${VERSION}" >> $GITHUB_OUTPUT

          echo "::notice::Building ref '${DISPATCH_REF:-<default>}' -> ${RESOLVED_SHA}"
          echo "::notice::Image: ${IMAGE}:${VERSION}"

      # Registry login — template CI contract v2. `vars.REGISTRY_KIND` selects
      # how this run authenticates to the registry:
      #   unset      legacy: the stored secrets.SCW_SECRET_KEY (unchanged)
      #   scw-oidc   keyless: this run's GitHub OIDC identity is exchanged with
      #              Nexus for an ephemeral registry credential, so the repo
      #              holds no registry secret at all.
      # Anything else is a stamping bug and fails the job rather than silently
      # falling back to an unauthenticated push.
      - name: Check registry kind
        env:
          REGISTRY_KIND: ${{ vars.REGISTRY_KIND }}
        run: |
          set -euo pipefail
          case "${REGISTRY_KIND:-}" in
            ''|scw-oidc) ;;
            *)
              echo "::error::Unknown REGISTRY_KIND '${REGISTRY_KIND}' — expected 'scw-oidc' or unset"
              exit 1
              ;;
          esac

      - name: Login to Scaleway Registry
        if: vars.REGISTRY_KIND == ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Login to Scaleway Registry (Nexus OIDC exchange)
        if: vars.REGISTRY_KIND == 'scw-oidc'
        env:
          NEXUS_API_URL: ${{ vars.NEXUS_API_URL }}
          REGISTRY_ENDPOINT: ${{ vars.REGISTRY_ENDPOINT }}
        run: |
          set -euo pipefail

          NEXUS_API_URL="${NEXUS_API_URL:-https://api.sassy.solutions}"

          # Only branch/tag runs carry an exchangeable identity: pull_request
          # runs (and forks) are refused by Nexus by design.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No GitHub OIDC token available — this job needs 'id-token: write' permission"
            exit 1
          fi

          # The audience is pinned: Nexus refuses a token minted for any other.
          ID_TOKEN=$(curl -sS --fail \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-registry" | jq -r '.value')
          echo "::add-mask::${ID_TOKEN}"
          if [ -z "${ID_TOKEN}" ] || [ "${ID_TOKEN}" = "null" ]; then
            echo "::error::GitHub returned an empty OIDC id-token"
            exit 1
          fi

          BODY=$(mktemp)
          STATUS=$(curl -sS -o "${BODY}" -w '%{http_code}' \
            -X POST "${NEXUS_API_URL%/}/api/v1/registry/ci-token" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg token "${ID_TOKEN}" '{token: $token}')")

          if [ "${STATUS}" != "200" ]; then
            # 401/403 bodies are deliberately generic; 503 carries an
            # operator-facing remediation in `detail` — surface both verbatim.
            TITLE=$(jq -r '.title // empty' "${BODY}" 2>/dev/null || echo '')
            DETAIL=$(jq -r '.detail // empty' "${BODY}" 2>/dev/null || echo '')
            echo "::error::Nexus registry token exchange failed (HTTP ${STATUS})"
            if [ -n "${TITLE}" ]; then echo "::error::${TITLE}"; fi
            if [ -n "${DETAIL}" ]; then echo "::error::${DETAIL}"; fi
            if [ -z "${TITLE}${DETAIL}" ]; then head -c 2000 "${BODY}"; echo; fi
            rm -f "${BODY}"
            exit 1
          fi

          # Mask the credential before it is read anywhere else.
          PASSWORD=$(jq -r '.password' "${BODY}")
          echo "::add-mask::${PASSWORD}"
          ENDPOINT=$(jq -r '.endpoint' "${BODY}")
          USERNAME=$(jq -r '.username' "${BODY}")
          EXPIRES=$(jq -r '.expiresInSeconds // empty' "${BODY}")
          rm -f "${BODY}"

          if [ -z "${ENDPOINT}" ] || [ "${ENDPOINT}" = "null" ] ||
             [ -z "${PASSWORD}" ] || [ "${PASSWORD}" = "null" ]; then
            echo "::error::Nexus returned an incomplete credential (endpoint or password missing)"
            exit 1
          fi

          # The image name is built from vars.REGISTRY_ENDPOINT (the stamped
          # contract), so a mismatch means the push lands nowhere useful.
          if [ "${ENDPOINT}" != "${REGISTRY_ENDPOINT}" ]; then
            echo "::warning::Registry endpoint drift — Nexus issued a credential for '${ENDPOINT}' but this repo pushes to vars.REGISTRY_ENDPOINT='${REGISTRY_ENDPOINT}'. The push will fail or target the wrong registry until REGISTRY_ENDPOINT is re-stamped."
          fi

          printf '%s' "${PASSWORD}" | docker login "${ENDPOINT}" --username "${USERNAME}" --password-stdin
          echo "::notice::Registry login OK via Nexus OIDC exchange (${ENDPOINT}, expires in ${EXPIRES:-?}s)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            INFORMATIONAL_VERSION=${{ steps.meta.outputs.version }}+${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Output image
        run: |
          echo "image=${{ steps.meta.outputs.image_full }}" >> $GITHUB_OUTPUT

  update-deployment:
    name: Update Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only the automatic push-to-main and release paths bump the deploy
    # manifests + commit. On-demand workflow_dispatch builds are build+push
    # ONLY: Nexus polls the registry for the resulting tag and deploys it via
    # its own GitOps path, so we must NOT commit to main on dispatch.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release events run at the TAG ref (detached HEAD): committing there made
          # `git push` fail with exit 128. The manifest bump always belongs on main.
          ref: main

      - name: Update image tag in values
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          # Update the image tag in deploy/values.yaml
          sed -i "s|tag: \".*\"|tag: \"${IMAGE_TAG}\"|g" deploy/values.yaml

          # Bump the kustomize image tag for the Nexus GitOps deploy path
          # (.nexus/manifests, POM-108). A Nexus version tag pins this commit,
          # so the manifests at that tag reference the image built from it.
          if [ -f ".nexus/manifests/base/kustomization.yaml" ]; then
            sed -i "s|newTag: .*|newTag: \"${IMAGE_TAG}\"|" .nexus/manifests/base/kustomization.yaml
            echo "Updated .nexus/manifests/base/kustomization.yaml:"
            grep -B1 "newTag:" .nexus/manifests/base/kustomization.yaml || true
          fi

          # Show the change
          echo "Updated deploy/values.yaml:"
          grep -A2 "image:" deploy/values.yaml || true

      - name: Commit and push
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deploy/values.yaml
          if [ -f ".nexus/manifests/base/kustomization.yaml" ]; then
            git add .nexus/manifests/base/kustomization.yaml
          fi
          # [skip ci] prevents infinite loop when this commit triggers the workflow again
          git diff --staged --quiet || git commit -m "chore: update image to ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Deployment Update

          ## Image Published
          \`${{ needs.build-and-push.outputs.image_full }}\`

          ## ArgoCD
          ArgoCD will automatically detect the change and deploy the new version.

          Monitor deployment:
          - ArgoCD UI: https://argocd.sassy.solutions
          - Application: ${{ github.repository }}

          EOF

  deploy-dev:
    name: Deploy to Dev
    needs: [build-and-push, update-deployment]
    runs-on: ubuntu-latest
    environment: dev
    # Auto-deploy to dev only on push-to-main. On-demand dispatch builds are
    # deployed by Nexus, not by this workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger ArgoCD Sync
        run: |
          # ArgoCD will auto-sync, but we can force it for immediate deployment
          echo "::notice::ArgoCD will automatically sync the new deployment"
          echo "::notice::Image: ${{ needs.build-and-push.outputs.image_full }}"

  deploy-prod:
    name: Deploy to Production
    needs: [build-and-push, update-deployment]
    runs-on: ubuntu-latest
    environment: prod
    # Only deploy to prod on release
    if: github.event_name == 'release'

    steps:
      - name: Production deployment
        run: |
          echo "::notice::Production deployment triggered"
          echo "::notice::Version: ${{ github.event.release.tag_name }}"
          echo "::notice::Image: ${{ needs.build-and-push.outputs.image_full }}"
