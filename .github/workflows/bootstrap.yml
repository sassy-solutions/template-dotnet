name: "Bootstrap Repository"

# This workflow runs ONCE when a repo is created from the template
# It renames all Template references to the actual service name
# and resets git history to start fresh

on:
  # Auto-trigger on first push when repo is created from template
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-bootstrap (will reset git history!)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  packages: read

jobs:
  bootstrap:
    name: Bootstrap Service
    runs-on: ubuntu-latest
    # Only run on main branch creation or manual dispatch
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if already bootstrapped
        id: check
        run: |
          # Check if this is the template repo itself
          if [ "${{ github.repository }}" = "sassy-solutions/template-dotnet" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::This is the template repository, skipping bootstrap"
            exit 0
          fi

          # Check for bootstrap marker (prevents re-running after force push)
          if [ -f ".bootstrapped" ]; then
            if [ "${{ github.event.inputs.force }}" != "true" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "::notice::Repository already bootstrapped"
              exit 0
            fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Extract service name
        if: steps.check.outputs.skip != 'true'
        id: extract
        run: |
          # Get repository name (e.g., "accelerate" from "sassy-solutions/accelerate")
          REPO_NAME="${{ github.repository }}"
          SERVICE_NAME_LOWER="${REPO_NAME##*/}"

          # Convert to PascalCase for C# namespaces
          # e.g., "my-cool-service" -> "MyCoolService", "app-6" -> "App6"
          # Step 1: Capitalize letters after hyphens/underscores
          # Step 2: Remove remaining hyphens/underscores (e.g., before digits)
          SERVICE_NAME=$(echo "$SERVICE_NAME_LOWER" | sed -r 's/(^|[-_])([a-z])/\U\2/g' | sed 's/[-_]//g')

          # Step 3: Strip any char that is not a C# identifier char.
          SERVICE_NAME=$(echo "$SERVICE_NAME" | sed 's/[^A-Za-z0-9]//g')

          # Step 4: A C# namespace/identifier cannot be empty or start with a digit.
          # An all-numeric repo name (e.g. "200720260913") would otherwise produce
          # `namespace 200720260913.Api` — uncompilable — so the image never builds and
          # the deploy ImagePullBackOffs forever. Prefix "Svc" to keep it valid. The
          # kebab/lower names below stay numeric, so the DNS host and image tag are
          # unaffected; only the C# namespace/assembly name is guarded.
          if [ -z "$SERVICE_NAME" ] || echo "$SERVICE_NAME" | grep -qE '^[0-9]'; then
            SERVICE_NAME="Svc${SERVICE_NAME}"
            echo "::warning::Repo name is empty or digit-leading; using C# namespace '${SERVICE_NAME}' (valid identifier)."
          fi

          # Convert to kebab-case for URLs (already lowercase with hyphens)
          SERVICE_NAME_KEBAB=$(echo "$SERVICE_NAME_LOWER" | tr '_' '-')

          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "service_name_lower=$SERVICE_NAME_LOWER" >> $GITHUB_OUTPUT
          echo "service_name_kebab=$SERVICE_NAME_KEBAB" >> $GITHUB_OUTPUT

          echo "::notice::Service Name: $SERVICE_NAME"
          echo "::notice::Service Name (lower): $SERVICE_NAME_LOWER"
          echo "::notice::Service Name (kebab): $SERVICE_NAME_KEBAB"

      - name: Rename files and directories
        if: steps.check.outputs.skip != 'true'
        run: |
          SERVICE_NAME="${{ steps.extract.outputs.service_name }}"

          echo "Renaming directories..."

          # Rename test project directory first (deepest)
          if [ -d "tests/Template.UnitTests" ]; then
            mv "tests/Template.UnitTests" "tests/${SERVICE_NAME}.UnitTests"
          fi

          # Rename API project directory
          if [ -d "src/Template.Api" ]; then
            mv "src/Template.Api" "src/${SERVICE_NAME}.Api"
          fi

          echo "Renaming files..."

          # Rename .csproj files
          find . -name "Template.*.csproj" -type f | while read f; do
            NEW_NAME=$(echo "$f" | sed "s/Template/${SERVICE_NAME}/g")
            mv "$f" "$NEW_NAME"
            echo "Renamed: $f -> $NEW_NAME"
          done

          # Rename .sln file
          if [ -f "Template.sln" ]; then
            mv "Template.sln" "${SERVICE_NAME}.sln"
            echo "Renamed: Template.sln -> ${SERVICE_NAME}.sln"
          fi

      - name: Replace placeholders in files
        if: steps.check.outputs.skip != 'true'
        run: |
          SERVICE_NAME="${{ steps.extract.outputs.service_name }}"
          SERVICE_NAME_LOWER="${{ steps.extract.outputs.service_name_lower }}"
          SERVICE_NAME_KEBAB="${{ steps.extract.outputs.service_name_kebab }}"

          echo "Replacing 'Template' with '$SERVICE_NAME' in all files..."

          # Replace in all relevant file types
          # IMPORTANT: Exclude .github/ — GITHUB_TOKEN cannot push workflow file changes
          # IMPORTANT: Exclude .nexus/ — K8s manifests contain `spec.template:` keys
          # that the word-boundary sed would corrupt; they use explicit
          # __APP_NAME__ / __IMAGE_REPOSITORY__ tokens substituted below instead.
          find . -type f \( \
            -name "*.cs" -o \
            -name "*.csproj" -o \
            -name "*.sln" -o \
            -name "*.json" -o \
            -name "*.yaml" -o \
            -name "*.yml" -o \
            -name "*.md" -o \
            -name "Dockerfile" -o \
            -name "*.props" \
          \) ! -path "./.git/*" ! -path "./.github/*" ! -path "./.nexus/*" ! -path "./node_modules/*" | while read f; do
            # Replace PascalCase Template -> ServiceName (word boundaries prevent matching substrings like outputTemplate)
            sed -i "s/\bTemplate\b/${SERVICE_NAME}/g" "$f"
            # Replace lowercase template -> service_name_lower
            sed -i "s/\btemplate\b/${SERVICE_NAME_LOWER}/g" "$f"
          done

          # Update template.json with actual values
          if [ -f "template.json" ]; then
            cat > template.json << EOF
          {
            "bootstrapped": true,
            "bootstrapped_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "service_name": "$SERVICE_NAME",
            "service_name_lower": "$SERVICE_NAME_LOWER",
            "service_name_kebab": "$SERVICE_NAME_KEBAB",
            "source_template": "dotnet-service-template",
            "template_version": "1.0.0"
          }
          EOF
          fi

          echo "Replacement complete!"

      - name: Update deploy values
        if: steps.check.outputs.skip != 'true'
        run: |
          SERVICE_NAME="${{ steps.extract.outputs.service_name }}"
          SERVICE_NAME_LOWER="${{ steps.extract.outputs.service_name_lower }}"
          SERVICE_NAME_KEBAB="${{ steps.extract.outputs.service_name_kebab }}"
          REGISTRY="${{ vars.REGISTRY_ENDPOINT }}"

          # Update deploy/values.yaml with actual service name
          if [ -f "deploy/values.yaml" ]; then
            sed -i "s|name: \"\"|name: \"${SERVICE_NAME_LOWER}\"|g" deploy/values.yaml
            sed -i "s|repository: \"\"|repository: \"${REGISTRY}/${SERVICE_NAME_KEBAB}-api\"|g" deploy/values.yaml
          fi

          # Update ArgoCD application
          if [ -f "deploy/argocd/application.yaml" ]; then
            sed -i "s|__SERVICE_NAME__|${SERVICE_NAME_LOWER}|g" deploy/argocd/application.yaml
          fi

          # Nexus GitOps manifests (.nexus/manifests) — POM-108 deploy contract.
          # __APP_NAME__ must match the platform's sanitized application name
          # (kebab-case), because the deployer health-gates on Deployment
          # "app-{name}" and materializes the env Secret "app-{name}-{env}-env".
          if [ -d ".nexus/manifests" ]; then
            find .nexus/manifests -type f \( -name "*.yaml" -o -name "*.md" \) | while read f; do
              sed -i "s|__APP_NAME__|${SERVICE_NAME_KEBAB}|g" "$f"
              sed -i "s|__IMAGE_REPOSITORY__|${REGISTRY}/${SERVICE_NAME_KEBAB}-api|g" "$f"
            done
            echo "::notice::Nexus manifests bound to app-${SERVICE_NAME_KEBAB} (image ${REGISTRY}/${SERVICE_NAME_KEBAB}-api)"
          fi

      - name: Setup .NET
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Authenticate GitHub Packages
        if: steps.check.outputs.skip != 'true'
        run: dotnet nuget update source github --username sassy-solutions --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile nuget.config

      - name: Fix import ordering
        if: steps.check.outputs.skip != 'true'
        # Cosmetic step: re-orders imports after the Template→<service> rename
        # changes namespace prefixes. Non-fatal — `dotnet format` requires a
        # successful `restore` and can flake on transient NuGet auth issues; we
        # don't want a cosmetic format step to block the bootstrap and leave the
        # downstream `deploy/values.yaml` un-substituted (which makes the K8s
        # pod start with `image: :latest` → InvalidImageName, the failure mode
        # observed live on 2026-05-10). The repo's normal CI pipeline still
        # enforces format on PRs, so any drift here gets caught later.
        continue-on-error: true
        run: |
          dotnet format --verbosity minimal
          echo "::notice::Import ordering fix attempted (non-fatal)"

      - name: Create bootstrap marker
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "Bootstrapped at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > .bootstrapped
          echo "Service: ${{ steps.extract.outputs.service_name }}" >> .bootstrapped

      - name: Commit and push changes
        if: steps.check.outputs.skip != 'true'
        run: |
          SERVICE_NAME="${{ steps.extract.outputs.service_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "feat: bootstrap ${SERVICE_NAME} from template

          All Template references renamed to ${SERVICE_NAME}.
          Bootstrapped from dotnet-service-template."

          git pull --rebase origin main && git push origin main

          echo "::notice::Bootstrap commit pushed"

      - name: Trigger CD
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for push to propagate..."
          sleep 5
          gh workflow run cd.yml --ref main
          echo "::notice::CD workflow dispatched"

      - name: Trigger onboarding
        if: steps.check.outputs.skip != 'true'
        run: |
          # Trigger the onboard-service workflow in Infrastructure repo
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/sassy-solutions/Infrastructure/actions/workflows/onboard-service.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "service_name": "${{ steps.extract.outputs.service_name_lower }}",
                "environment": "dev",
                "enable_ingress": "false",
                "source_repo": "${{ github.repository }}"
              }
            }' || echo "::warning::Could not trigger onboarding workflow"

      - name: Generate summary
        if: steps.check.outputs.skip != 'true'
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Bootstrap Complete

          Your service **${{ steps.extract.outputs.service_name }}** has been initialized!

          ## What happened:
          - All \`Template\` references renamed to \`${{ steps.extract.outputs.service_name }}\`
          - Git history reset (fresh start, no template commits)
          - Onboarding workflow triggered in Infrastructure repo

          ## Next steps:
          1. Clone your fresh repository
          2. Open in your IDE and start coding!
          3. Push changes to trigger CI/CD

          ## Structure:
          \`\`\`
          ${{ steps.extract.outputs.service_name }}/
          ├── src/
          │   └── ${{ steps.extract.outputs.service_name }}.Api/
          ├── tests/
          │   └── ${{ steps.extract.outputs.service_name }}.UnitTests/
          ├── deploy/
          └── ${{ steps.extract.outputs.service_name }}.sln
          \`\`\`

          ## Endpoints (after deployment):
          - Dev: \`https://${{ steps.extract.outputs.service_name_kebab }}.dev.sassy.solutions\`
          - Swagger: \`/swagger\`
          - Health: \`/health\`
          EOF
