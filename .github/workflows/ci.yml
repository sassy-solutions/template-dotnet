name: "CI"

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.github/workflows/bootstrap.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  check-bootstrap:
    name: Check Bootstrap
    runs-on: dotnet
    outputs:
      bootstrapped: ${{ steps.check.outputs.bootstrapped }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .bootstrapped
      - id: check
        run: |
          if [ -f .bootstrapped ]; then
            echo "bootstrapped=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Not yet bootstrapped — skipping CI"
            echo "bootstrapped=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build & Test
    needs: check-bootstrap
    if: needs.check-bootstrap.outputs.bootstrapped == 'true'
    runs-on: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate GitHub Packages
        run: dotnet nuget update source github --username sassy-solutions --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile nuget.config

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: vars.SKIP_TESTS != 'true'
        run: |
          dotnet test --no-build --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Upload coverage
        if: vars.SKIP_TESTS != 'true'
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    name: Lint & Format
    needs: check-bootstrap
    if: needs.check-bootstrap.outputs.bootstrapped == 'true'
    runs-on: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate GitHub Packages
        run: dotnet nuget update source github --username sassy-solutions --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile nuget.config

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  security:
    name: Security Scan
    needs: check-bootstrap
    if: needs.check-bootstrap.outputs.bootstrapped == 'true' && vars.SKIP_SECURITY_SCAN != 'true'
    runs-on: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate GitHub Packages
        run: dotnet nuget update source github --username sassy-solutions --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile nuget.config

      - name: Restore
        run: dotnet restore

      - name: Run security scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee security-report.txt
          if grep -q "has the following vulnerable packages" security-report.txt; then
            echo "::warning::Vulnerable packages detected!"
            cat security-report.txt
          fi
