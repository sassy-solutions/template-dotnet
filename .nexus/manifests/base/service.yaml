# Service exposing the API inside the tenant namespace.
# CONTRACT: the platform's central NGINX ingress targets
# Service "app-{name}" on port 80 (see KubernetesApplicationDeployer
# CreateIngressAsync — backend service "app-{appName}", port 80).
apiVersion: v1
kind: Service
metadata:
  name: app-__APP_NAME__
  labels:
    app.kubernetes.io/name: __APP_NAME__
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: nexus-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: __APP_NAME__
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
