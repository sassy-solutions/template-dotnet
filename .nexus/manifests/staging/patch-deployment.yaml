# Binds the deployer-managed env Secret for the "staging" environment.
# Secret name contract: app-{name}-{envSlug}-env
# (created/replaced by the platform before each ArgoCD sync).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-__APP_NAME__
spec:
  template:
    spec:
      containers:
        - name: api
          envFrom:
            - secretRef:
                name: app-__APP_NAME__-staging-env
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Staging
            - name: Nexus__Environment
              value: staging
